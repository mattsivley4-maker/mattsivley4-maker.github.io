  <title>Texas Ingram Ready Mix / Air Evac Coverage Map</title>
  <style>
    :root {
      color-scheme: light dark;
      --foreground: #172033;
      --muted-foreground: #5f6b7a;
      background: #f7f9fc;
    }
    @media (prefers-color-scheme: dark) {

        --muted-foreground: #aeb7c2;
        background: #0f172a;
      }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      color: var(--foreground);
      background: Canvas;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      width: min(1120px, 100%);

      --air-color: light-dark(rgb(37 99 235), rgb(125 180 255));
      --ring-color: light-dark(rgb(220 38 38), rgb(248 113 113));
      --ring-fill: light-dark(rgb(254 226 226 / 34%), rgb(127 29 29 / 24%));
    }
    #texas-ingram-air-evac-map .map-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    #texas-ingram-air-evac-map h2 {
      margin: 0;
      font-weight: 500;
    }
    #texas-ingram-air-evac-map .map-meta {
      color: var(--muted-foreground);
    }
    #texas-ingram-air-evac-map .legend {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 8px;
      color: var(--muted-foreground);
    }
    #texas-ingram-air-evac-map .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    #texas-ingram-air-evac-map .legend-pin {
      width: 10px;
      height: 10px;
      border-radius: 999px 999px 999px 0;
      transform: rotate(-45deg);
      background: var(--ingram-pin);
      display: inline-block;
    }
    #texas-ingram-air-evac-map .legend-ring {
      width: 18px;
      height: 10px;
      border: 2px solid var(--ring-color);
      border-radius: 999px;
      background: var(--ring-fill);
      display: inline-block;
    }
    #texas-ingram-air-evac-map .legend-base {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--air-color);
      display: inline-block;
    }
    #texas-ingram-air-evac-map .map-shell {
      position: relative;
      width: 100%;
    }
    #texas-ingram-air-evac-map svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }
    #texas-ingram-air-evac-map .county {
      fill: var(--county-fill);
      stroke: var(--county-stroke);
      stroke-width: 0.7;
    }
    #texas-ingram-air-evac-map .county:hover {
      fill: var(--county-hover);
    }
    #texas-ingram-air-evac-map .radius {
      fill: var(--ring-fill);
      stroke: var(--ring-color);
      stroke-width: 1.05;
    }
    #texas-ingram-air-evac-map .air-base {
      fill: var(--air-color);
      stroke: var(--pin-halo);
      stroke-width: 1.4;
    }
    #texas-ingram-air-evac-map .ingram-pin {
      fill: var(--ingram-pin);
      stroke: var(--pin-halo);
      stroke-width: 1.2;
      paint-order: stroke fill;
    }
    #texas-ingram-air-evac-map .ingram-dot {
      fill: var(--pin-halo);
      stroke: none;
      pointer-events: none;
    }
    #texas-ingram-air-evac-map .tooltip {
      display: none;
      position: absolute;
      max-width: min(320px, calc(100% - 20px));
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--popover);
      color: var(--popover-foreground);
      box-shadow: 0 8px 22px color-mix(in srgb, var(--foreground) 14%, transparent);
      pointer-events: none;
      z-index: 2;
    }
    #texas-ingram-air-evac-map .tooltip strong {
      font-weight: 500;
    }
    #texas-ingram-air-evac-map .tooltip .muted {
      color: var(--muted-foreground);
    }
    @media (max-width: 520px) {
      #texas-ingram-air-evac-map .map-head {
        display: block;
      }
      #texas-ingram-air-evac-map .map-meta {
        margin-top: 2px;
      }
      #texas-ingram-air-evac-map .legend {
        gap: 8px 12px;
      }
    }

      const svg = d3.select(root).select("svg");
      const shell = root.querySelector(".map-shell");
      const tooltip = root.querySelector(".tooltip");
      const pinPath = "M0,-10 C-4.8,-10 -8,-6.7 -8,-2.2 C-8,4.2 0,11 0,11 C0,11 8,4.2 8,-2.2 C8,-6.7 4.8,-10 0,-10 Z";

      function esc(value) {
        return String(value).replace(/[&<>"']/g, function (char) {
          const entities = new Map([["&", "&amp;"], ["<", "&lt;"], [">", "&gt;"], ['"', "&quot;"], ["'", "&#39;"]]);
          return entities.get(char);
        });
      }

      function showTooltip(event, html) {
        tooltip.innerHTML = html;
        tooltip.style.display = "block";
        moveTooltip(event);
      }

      function moveTooltip(event) {
        const rect = shell.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        const box = tooltip.getBoundingClientRect();
        let left = x + 14;
        let top = y + 12;
        if (left + box.width > rect.width - 4) left = x - box.width - 14;
        if (top + box.height > rect.height - 4) top = y - box.height - 14;
        tooltip.style.left = Math.max(4, left) + "px";
        tooltip.style.top = Math.max(4, top) + "px";
      }

      function hideTooltip() {
        tooltip.style.display = "none";
      }

      function pointHtml(kind, d) {
        return '<strong>' + esc(d.name) + '</strong><br>' +
          '<span class="muted">' + esc(kind) + '</span><br>' +
          esc(d.address) + '<br>' +
          '<span class="muted">' + d.lat.toFixed(6) + ', ' + d.lng.toFixed(6) + '</span><br>' +
          '<span class="muted">' + esc(d.source) + '</span>';
      }

      function ringHtml(d) {
        return '<strong>' + esc(d.properties.name) + '</strong><br>' +
          '<span class="muted">75 nautical mile geodesic radius</span>';
      }

      function countyHtml(d) {
        return '<strong>' + esc(d.properties.name) + ' County</strong><br>' +
          '<span class="muted">Census county geometry, GEOID ' + esc(d.properties.geoid) + '</span>';
      }

      function draw() {
        const width = Math.max(320, Math.floor(shell.clientWidth || 736));
        const height = Math.max(315, Math.round(width * 0.86));
        svg.attr("viewBox", "0 0 " + width + " " + height);
        svg.selectAll("*").remove();

        const projection = d3.geoMercator();
        const fitFeatures = {
          type: "FeatureCollection",
          features: counties.features.concat(airCircles)
        };
        projection.fitExtent([[12, 14], [width - 12, height - 14]], fitFeatures);
        const path = d3.geoPath(projection);

        svg.append("g")
          .selectAll("path")
          .data(counties.features)
          .join("path")
          .attr("class", "county")
          .attr("d", path)
          .on("mouseenter", function (event, d) { showTooltip(event, countyHtml(d)); })
          .on("mousemove", moveTooltip)
          .on("mouseleave", hideTooltip);

        svg.append("g")
          .selectAll("path")
          .data(airCircles)
          .join("path")
          .attr("class", "radius")
          .attr("d", path)
          .on("mouseenter", function (event, d) { showTooltip(event, ringHtml(d)); })
          .on("mousemove", moveTooltip)
          .on("mouseleave", hideTooltip);

        svg.append("g")
          .selectAll("circle")
          .data(airBases)
          .join("circle")
          .attr("class", "air-base")
          .attr("r", 4.2)
          .attr("cx", function (d) { return projection([d.lng, d.lat])[0]; })
          .attr("cy", function (d) { return projection([d.lng, d.lat])[1]; })
          .on("mouseenter", function (event, d) { showTooltip(event, pointHtml("Air Evac base", d)); })
          .on("mousemove", moveTooltip)
          .on("mouseleave", hideTooltip);

        const pins = svg.append("g")
          .selectAll("g")
          .data(ingram)
          .join("g")
          .attr("transform", function (d) {
            const point = projection([d.lng, d.lat]);
            return "translate(" + point[0] + "," + point[1] + ")";
          })
          .on("mouseenter", function (event, d) { showTooltip(event, pointHtml("Ingram Ready Mix", d)); })
          .on("mousemove", moveTooltip)
          .on("mouseleave", hideTooltip);

        pins.append("path")
          .attr("class", "ingram-pin")
          .attr("d", pinPath);

        pins.append("circle")
          .attr("class", "ingram-dot")
          .attr("r", 2)
          .attr("cy", -2.2);
      }

      draw();
      new ResizeObserver(draw).observe(shell);
    }());
